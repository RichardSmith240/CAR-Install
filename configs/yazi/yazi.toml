[theme]
use = "custom"

[opener]
edit = [
	{ run = "$EDITOR %s", desc = "$EDITOR", for= "unix", block = true}
]

open = [
	{ run = "xdg-open %s1", desc = "Play", for = "linux" }
]

reveal = [
	{ run = "xdg-open %d1", desc = "Reveal", for = "linux" }
]

libreoffice = [
	{ run = 'libreoffice "$@"', orphan = true, desc = "LibreOffice" }
]

gwenview = [
	{ run = 'gwenview "$@"', orphan = true, desc = "GwenView" }
]

mpv = [
	{ run = 'mpv "$@"', orphan = true, desc = "mpv Media Player" }
]

audacity = [
	{ run = 'audacity "$@"', orphan = true, desc = "Audacity" }
]

[open]
rules = [
	{ url = "*/", use = [ "edit", "open", "reveal" ] },
	{ mime = "text/*", use = [ "edit", "reveal" ] },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal" ] },
	{ mime = "application/{json,ndjson}", use = [ "edit", "reveal" ] },
	{ mime = "*/javascript", use = [ "edit", "reveal" ] },
	{ mime = "inode/empty", use = [ "edit", "reveal" ] },
	{ mime = "vfs/{absent,stale}", use = "download" },
	{ mime = "application/vnd.openxmlformats-officedocument.wordprocessingml.document", use = [ "libreoffice", "reveal" ] }, 
	{ mime = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", use = [ "libreoffice", "reveal" ] },       
	{ mime = "application/vnd.openxmlformats-officedocument.presentationml.presentation", use = [ "libreoffice", "reveal" ] },
	{ mime = "application/vnd.oasis.opendocument.text", use = [ "libreoffice", "reveal" ] },
	{ mime = "application/pdf", use = [ "libreoffice", "reveal" ] }, 
	{ mime = "image/png", use = [ "gwenview", "reveal" ] },
	{ mime = "image/jpeg", use = [ "gwenview", "reveal" ] },
	{ mime = "image/gif", use = [ "gwenview", "reveal" ] },
	{ mime = "video/mp4", use = [ "mpv", "reveal" ] },
	{ mime = "video/quicktime", use = [ "mpv", "reveal" ] }, 
	{ mime = "audio/mpeg", use = [ "audacity", "reveal" ] }, 
	{ mime = "audio/wav", use = [ "audacity", "reveal" ] },  
	{ url = "*", use = [ "open", "reveal" ] },

]

